<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Areas of focus</title><desc id="d">Three focus areas: agentic AI, computer vision, and full-stack AI products, each with where it is shown.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A4C0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#16264A"/></linearGradient></defs><rect x="0" y="0" width="400" height="250" rx="16" fill="#131F38" opacity="1" stroke="#26385C" stroke-width="1"/><rect x="0" y="0" width="400" height="5" rx="2" fill="#2DD4BF" opacity="1"/><rect x="28" y="32" width="30" height="30" rx="8" fill="#2DD4BF" opacity="0.18"/><rect x="37" y="41" width="12" height="12" rx="3" fill="#2DD4BF" opacity="1"/><text x="72" y="55" font-size="22" fill="#E8EEF8" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Agentic AI</text><circle cx="34" cy="100" r="3.2" fill="#2DD4BF" opacity="1"/><text x="48" y="105" font-size="14.5" fill="#E8EEF8" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Multi-agent orchestration: LangGraph, CrewAI</text><circle cx="34" cy="134" r="3.2" fill="#2DD4BF" opacity="1"/><text x="48" y="139" font-size="14.5" fill="#E8EEF8" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Self-healing repair loops, sandboxed execution</text><circle cx="34" cy="168" r="3.2" fill="#2DD4BF" opacity="1"/><text x="48" y="173" font-size="14.5" fill="#E8EEF8" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">MCP and multi-provider LLM routing</text><line x1="28" y1="205" x2="372" y2="205" stroke="#26385C" stroke-width="1" opacity="1"/><text x="28" y="232" font-size="12.5" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Shown in: KAIROS V1, WhiskrCode</text><rect x="440" y="0" width="400" height="250" rx="16" fill="#131F38" opacity="1" stroke="#26385C" stroke-width="1"/><rect x="440" y="0" width="400" height="5" rx="2" fill="#818CF8" opacity="1"/><rect x="468" y="32" width="30" height="30" rx="8" fill="#818CF8" opacity="0.18"/><rect x="477" y="41" width="12" height="12" rx="3" fill="#818CF8" opacity="1"/><text x="512" y="55" font-size="22" fill="#E8EEF8" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Computer vision</text><circle cx="474" cy="100" r="3.2" fill="#818CF8" opacity="1"/><text x="488" y="105" font-size="14.5" fill="#E8EEF8" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Real-time YOLOv8 industrial pipeline</text><circle cx="474" cy="134" r="3.2" fill="#818CF8" opacity="1"/><text x="488" y="139" font-size="14.5" fill="#E8EEF8" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Annotation, training and evaluation</text><circle cx="474" cy="168" r="3.2" fill="#818CF8" opacity="1"/><text x="488" y="173" font-size="14.5" fill="#E8EEF8" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Deployed as a desktop application</text><line x1="468" y1="205" x2="812" y2="205" stroke="#26385C" stroke-width="1" opacity="1"/><text x="468" y="232" font-size="12.5" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0"