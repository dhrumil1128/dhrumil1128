<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">KAIROS V1 system overview</title><desc id="d">Six agents in sequence with a repair loop, deterministic blueprints and a sandboxed executor, over a multi-provider LLM routing layer, packaged as a desktop app.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A4C0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#16264A"/></linearGradient></defs><rect x="0" y="0" width="1280" height="540" rx="18" fill="#111B30" opacity="1" stroke="#26385C" stroke-width="1"/><text x="40" y="52" font-size="24" fill="#E8EEF8" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">KAIROS V1</text><text x="40" y="76" font-size="14" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">System overview: orchestration, self-repair, sandboxing, provider routing and packaging</text><rect x="70" y="110" width="160" height="58" rx="10" fill="#131F38" opacity="1" stroke="#2DD4BF" stroke-width="1.4"/><text x="150.0" y="144.0" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Planner</text><line x1="232" y1="139" x2="264" y2="139" stroke="#2DD4BF" stroke-width="2" opacity="1" marker-end="url(#at)"/><rect x="266" y="110" width="160" height="58" rx="10" fill="#131F38" opacity="1" stroke="#2DD4BF" stroke-width="1.4"/><text x="346.0" y="144.0" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Architect</text><line x1="428" y1="139" x2="460" y2="139" stroke="#2DD4BF" stroke-width="2" opacity="1" marker-end="url(#at)"/><rect x="462" y="110" width="160" height="58" rx="10" fill="#131F38" opacity="1" stroke="#2DD4BF" stroke-width="1.4"/><text x="542.0" y="144.0" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Coder</text><line x1="624" y1="139" x2="656" y2="139" stroke="#2DD4BF" stroke-width="2" opacity="1" marker-end="url(#at)"/><rect x="658" y="110" width="160" height="58" rx="10" fill="#131F38" opacity="1" stroke="#FBBF24" stroke-width="1.4"/><text x="738.0" y="144.0" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Reviewer</text><line x1="820" y1="139" x2="852" y2="139" stroke="#2DD4BF" stroke-width="2" opacity="1" marker-end="url(#at)"/><rect x="854" y="110" width="160" height="58" rx="10" fill="#131F38" opacity="1" stroke="#2DD4BF" stroke-width="1.4"/><text x="934.0" y="144.0" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Tester</text><line x1="1016" y1="139" x2="1048" y2="139" stroke="#2DD4BF" stroke-width="2" opacity="1" marker-end="url(#at)"/><rect x="1050" y="110" width="160" height="58" rx="10" fill="#131F38" opacity="1" stroke="#2DD4BF" stroke-width="1.4"/><text x="1130.0" y="144.0" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Memory</text><text x="40" y="105" font-size="11" fill="#2DD4BF" font-weight="700" text-anchor="start" opacity="1" letter-spacing="2">SIX-AGENT PIPELINE</text><rect x="630" y="205" width="200" height="70" rx="10" fill="#131F38" opacity="1" stroke="#FBBF24" stroke-width="1.4"/><text x="730" y="232" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Repair loop</text><text x="730" y="252" font-size="11.5" fill="#93A4C0" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">fix plan, then re-run reviewer</text><line x1="716" y1="170" x2="716" y2="203" stroke="#FBBF24" stroke-width="2" opacity="1" marker-end="url(#aa)"/><line x1="752" y1="203" x2="752" y2="172" stroke="#FBBF24" stroke-width="2" opacity="1" marker-end="url(#aa)"/><text x="706" y="190" font-size="11" fill="#FBBF24" font-weight="600" text-anchor="end" opacity="1" letter-spacing="0">fail</text><text x="762" y="190" font-size="11" fill="#FBBF24" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">fixed</text><rect x="850" y="205" width="250" height="70" rx="10" fill="#131F38" opacity="1" stroke="#818CF8" stroke-width="1.4" stroke-dasharray="6 4"/><text x="975" y="232" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Sandboxed executor</text><text x="975" y="252" font-size="11.5" fill="#93A4C0" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">isolated subprocess, 30 s timeout</text><line x1="934" y1="170" x2="934" y2="203" stroke="#818CF8" stroke-width="2" opacity="1" stroke-dasharray="5 4" marker-end="url(#av)"/><rect x="266" y="205" width="356" height="70" rx="10" fill="#131F38" opacity="1" stroke="#2DD4BF" stroke-width="1.4"/><text x="444" y="232" font-size="16" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Deterministic blueprints</text><text x="444" y="252" font-size="11.5" fill="#93A4C0" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">framework templates fix the project layout</text><line x1="346" y1="170" x2="346" y2="203" stroke="#2DD4BF" stroke-width="1.6" opacity="1" stroke-dasharray="5 4" marker-end="url(#at)"/><line x1="542" y1="170" x2="542" y2="203" stroke="#2DD4BF" stroke-width="1.6" opacity="1" stroke-dasharray="5 4" marker-end="url(#at)"/><rect x="40" y="310" width="1200" height="96" rx="14" fill="#131F38" opacity="1" stroke="#26385C" stroke-width="1"/><text x="64" y="338" font-size="11" fill="#818CF8" font-weight="700" text-anchor="start" opacity="1" letter-spacing="2">MULTI-PROVIDER LLM ROUTING</text><text x="64" y="360" font-size="13.5" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">One provider abstraction layer used by every agent</text><rect x="430" y="338" width="140" height="40" rx="20" fill="#111B30" opacity="1" stroke="#818CF8" stroke-width="1.2"/><text x="500" y="363" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">OpenAI</text><rect x="590" y="338" width="140" height="40" rx="20" fill="#111B30" opacity="1" stroke="#818CF8" stroke-width="1.2"/><text x="660" y="363" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">Claude</text><rect x="750" y="338" width="140" height="40" rx="20" fill="#111B30" opacity="1" stroke="#818CF8" stroke-width="1.2"/><text x="820" y="363" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">Gemini</text><rect x="910" y="338" width="140" height="40" rx="20" fill="#111B30" opacity="1" stroke="#818CF8" stroke-width="1.2"/><text x="980" y="363" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">Ollama</text><rect x="1070" y="338" width="140" height="40" rx="20" fill="#111B30" opacity="1" stroke="#818CF8" stroke-width="1.2"/><text x="1140" y="363" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">NVIDIA</text><line x1="640" y1="280" x2="640" y2="308" stroke="#818CF8" stroke-width="1.6" opacity="1" stroke-dasharray="5 4" marker-end="url(#av)"/><rect x="40" y="430" width="1200" height="82" rx="14" fill="#131F38" opacity="1" stroke="#26385C" stroke-width="1"/><text x="64" y="458" font-size="11" fill="#FBBF24" font-weight="700" text-anchor="start" opacity="1" letter-spacing="2">DESKTOP AUTOMATION AND PACKAGING</text><rect x="64" y="470" width="150" height="30" rx="15" fill="#111B30" opacity="1" stroke="#FBBF24" stroke-width="1.2"/><text x="139" y="490" font-size="13.5" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">PyAutoGUI</text><rect x="234" y="470" width="150" height="30" rx="15" fill="#111B30" opacity="1" stroke="#FBBF24" stroke-width="1.2"/><text x="309" y="490" font-size="13.5" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">PyGetWindow</text><rect x="404" y="470" width="150" height="30" rx="15" fill="#111B30" opacity="1" stroke="#FBBF24" stroke-width="1.2"/><text x="479" y="490" font-size="13.5" fill="#E8EEF8" font-weight="600" text-anchor="middle" opacity="1" letter-spacing="0">Playwright</text><text x="620" y="490" font-size="14" fill="#E8EEF8" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">PyQt6 + PyInstaller: standalone cross-platform desktop application</text></svg>