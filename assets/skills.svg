<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Skills by project</title><desc id="d">Matrix of skill areas against four project groups, filled where the technology appears in that project's stack.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93A4C0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#16264A"/></linearGradient></defs><rect x="0" y="0" width="1280" height="470" rx="18" fill="#111B30" opacity="1" stroke="#26385C" stroke-width="1"/><text x="40" y="50" font-size="24" fill="#E8EEF8" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Where I have used what</text><text x="40" y="74" font-size="14" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Built from the documented stack of each project, not a self-rated skill bar</text><text x="560" y="120" font-size="14.5" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">WhiskrCode</text><text x="760" y="120" font-size="14.5" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">KAIROS V1</text><text x="960" y="120" font-size="14.5" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">AI IntelHub</text><text x="1160" y="120" font-size="14.5" fill="#E8EEF8" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">Agent and ML projects</text><line x1="40" y1="134" x2="1240" y2="134" stroke="#26385C" stroke-width="1" opacity="1"/><rect x="40" y="136" width="1200" height="38" rx="8" fill="#131F38" opacity="0.7"/><text x="60" y="155" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Agentic AI</text><text x="300" y="155" font-size="12" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">LangGraph, CrewAI, MCP</text><circle cx="560" cy="155" r="8" fill="#2DD4BF" opacity="1"/><circle cx="760" cy="155" r="8" fill="#2DD4BF" opacity="1"/><circle cx="960" cy="155" r="7" fill="none" opacity="1" stroke="#26385C" stroke-width="1.5"/><circle cx="1160" cy="155" r="8" fill="#2DD4BF" opacity="1"/><text x="60" y="195" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">RAG and vector search</text><text x="300" y="195" font-size="12" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">pgvector, retrieval pipelines</text><circle cx="560" cy="195" r="7" fill="none" opacity="1" stroke="#26385C" stroke-width="1.5"/><circle cx="760" cy="195" r="7" fill="none" opacity="1" stroke="#26385C" stroke-width="1.5"/><circle cx="960" cy="195" r="8" fill="#2DD4BF" opacity="1"/><circle cx="1160" cy="195" r="7" fill="none" opacity="1" stroke="#26385C" stroke-width="1.5"/><rect x="40" y="216" width="1200" height="38" rx="8" fill="#131F38" opacity="0.7"/><text x="60" y="235" font-size="15" fill="#E8EEF8" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Computer vision and ML</text><text x="300" y="235" font-size="12" fill="#93A4C0" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">YOLOv8, scikit-learn</text><circl